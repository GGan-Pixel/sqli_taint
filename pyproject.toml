[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sqli-taint"
version = "0.1.0"
description = "Static analyzer in Python detecting SQL injection vulnerabilities using taint analysis"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Portfolio Project" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
sqli-taint = "sqli_taint.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sqli_taint*"]

[tool.setuptools.package-data]
sqli_taint = ["rules/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
